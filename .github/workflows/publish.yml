name: 发布每日笔记

on:
  # 笔记或博客模板有改动时，立即生成
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/**'
      - 'assets/blog.css'
      - 'blog.config.json'
      - '.github/workflows/publish.yml'
  # 每 30 分钟检查一次：取回 Obsidian 同步过来的新笔记，并放出到了日期的定时笔记
  schedule:
    - cron: '*/30 * * * *'
  # 在 GitHub 的 Actions 页面可以手动点"Run workflow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 如果在仓库设置里填了 NOTES_REPO（Obsidian 笔记仓库），就从那里读取笔记
      - name: 取回 Obsidian 笔记
        if: ${{ vars.NOTES_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NOTES_REPO }}
          path: _notes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 生成博客页面
        env:
          NOTES_DIR: ${{ vars.NOTES_REPO != '' && format('_notes/{0}', vars.NOTES_SUBDIR || '每日笔记') || 'posts' }}
        run: node scripts/build-blog.mjs

      - name: 有变化才提交
        run: |
          git config user.name "blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "没有新内容"
          else
            git commit -m "发布每日笔记 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
